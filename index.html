<title>Responsabilidad Social y Educativa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda de marca en carbón con el logo, pestañas fijas y un área de trabajo por módulo
   (Tareas · Inventario · Calendario · Charlas). Colores tomados del logo Vive Más: turquesa + carbón. */
:root {
  --brand: #00BFA6;        /* turquesa del logo */
  --brand-ink: #007A6B;    /* turquesa oscuro para texto sobre claro */
  --brand-soft: #DCF4F0;
  --charcoal: #2F3433;     /* carbón del logo */
  --on-charcoal: #F1F6F5;
  --bg: #F3F7F6;
  --surface: #FFFFFF;
  --surface-2: #EBF1F0;
  --line: #D6E1DF;
  --fg: #1E2625;
  --muted: #586664;
  --ok: #157F47;  --ok-dot: #1FAA5E;  --ok-soft: #DDF2E5;
  --warn: #8A6200; --warn-dot: #F2B705; --warn-soft: #FBF0CC;
  --bad: #B83232; --bad-dot: #DE4545; --bad-soft: #F8E0DF;
  --shadow: 0 1px 2px rgb(16 40 37 / .06), 0 6px 18px rgb(16 40 37 / .06);
  --backdrop: rgb(15 22 21 / .5);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #1FCDB4; --brand-ink: #5FDECA; --brand-soft: #123B35;
  --charcoal: #0D1211; --on-charcoal: #EAF2F0;
  --bg: #121817; --surface: #1A2221; --surface-2: #212B29; --line: #2E3A38;
  --fg: #E5EEEC; --muted: #9BABA8;
  --ok: #5ED394; --ok-dot: #3FC27B; --ok-soft: #15362A;
  --warn: #F4C95A; --warn-dot: #F2B705; --warn-soft: #3A3115;
  --bad: #F28B8B; --bad-dot: #E65A5A; --bad-soft: #3F1E1E;
  --shadow: 0 1px 2px rgb(0 0 0 / .3);
  --backdrop: rgb(0 0 0 / .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --brand: #1FCDB4; --brand-ink: #5FDECA; --brand-soft: #123B35;
  --charcoal: #0D1211; --on-charcoal: #EAF2F0;
  --bg: #121817; --surface: #1A2221; --surface-2: #212B29; --line: #2E3A38;
  --fg: #E5EEEC; --muted: #9BABA8;
  --ok: #5ED394; --ok-dot: #3FC27B; --ok-soft: #15362A;
  --warn: #F4C95A; --warn-dot: #F2B705; --warn-soft: #3A3115;
  --bad: #F28B8B; --bad-dot: #E65A5A; --bad-soft: #3F1E1E;
  --shadow: 0 1px 2px rgb(0 0 0 / .3);
  --backdrop: rgb(0 0 0 / .6);
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Cabecera de marca ---------- */
.masthead { background: var(--charcoal); color: var(--on-charcoal); position: relative; overflow: hidden; }
.masthead::after { /* arco turquesa, eco del trazo del logo */
  content: ""; position: absolute; right: -120px; top: -160px; width: 420px; height: 420px; border-radius: 50%;
  border: 34px solid var(--brand); border-left-color: transparent; border-bottom-color: transparent; opacity: .22; transform: rotate(18deg); pointer-events: none;
}
.mast-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; flex-wrap: wrap; position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo-tile { flex: none; width: 68px; height: 68px; border-radius: 16px; background: #FFFFFF; display: grid; place-items: center; }
.logo-tile img { width: 52px; height: 52px; object-fit: contain; }
.org { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
.masthead h1 { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; letter-spacing: -.01em; }
.slogan { margin-top: 2px; font-size: 14px; opacity: .85; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: rgb(255 255 255 / .08); color: var(--on-charcoal); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn-dot); }
.sync.ok .dot { background: var(--brand); box-shadow: 0 0 0 3px rgb(0 191 166 / .25); }
.sync.err .dot { background: var(--bad-dot); }

/* ---------- Pestañas ---------- */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 14px 14px 12px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--brand); }
.tab svg { width: 18px; height: 18px; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; display: inline-grid; place-items: center; background: var(--bad-soft); color: var(--bad); font-weight: 700; }

/* ---------- Estructura de vistas ---------- */
main { padding-block: 24px 64px; }
.view { display: grid; gap: 20px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head h2 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 800; }
.lede { color: var(--muted); max-width: 62ch; margin-top: 4px; }
.notice { padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }
.notice.info { background: var(--brand-soft); color: var(--brand-ink); }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r-sm); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #0B2A26; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 14px; }
.btn svg { width: 16px; height: 16px; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 18px; height: 18px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field { display: grid; gap: 5px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.toolbar select { flex: 0 1 190px; width: auto; }

/* Interruptor segmentado */
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* ---------- Semáforo ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok::before { background: var(--ok-dot); } .pill.warn::before { background: var(--warn-dot); } .pill.bad::before { background: var(--bad-dot); }
.lights { display: inline-flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--surface-2); }
.light { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; opacity: .32; transition: opacity .15s, transform .15s; }
.light.ok { background: var(--ok-dot); } .light.warn { background: var(--warn-dot); } .light.bad { background: var(--bad-dot); }
.light[aria-pressed="true"] { opacity: 1; border-color: var(--surface); box-shadow: 0 0 0 2px var(--fg); }
.light:hover { opacity: .8; }

/* ---------- Resumen de tareas ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { flex: 1 1 130px; display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-align: left; cursor: pointer; }
.stat strong { font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.stat[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.stat i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---------- Tarjetas de tareas ---------- */
.task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.task.done { opacity: .78; }
.task.done h3 { text-decoration: line-through; text-decoration-color: var(--muted); }
.task-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.due { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due.late { color: var(--bad); font-weight: 700; }
.task h3 { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.desc { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--brand-soft); color: var(--brand-ink); }
.avatar.empty { background: var(--surface-2); color: var(--muted); }
.person div { min-width: 0; display: grid; }
.person strong { font-weight: 600; overflow-wrap: anywhere; }
.email { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.task-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--line); }
.task-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task-foot .grow { flex: 1; }
.link-btn { border: 0; background: none; color: var(--brand-ink); font-weight: 600; cursor: pointer; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }
.link-btn svg { width: 16px; height: 16px; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--bad); }

/* ---------- Estado vacío ---------- */
.empty { border: 2px dashed var(--line); border-radius: var(--r-lg); padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h3 { color: var(--fg); font-size: 18px; }

/* ---------- Inventario ---------- */
.inv-stats { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
.inv-stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.inv-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.inv-row { display: grid; grid-template-columns: minmax(0, 2fr) 150px minmax(0, 1.3fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.inv-row:first-child { border-top: 0; }
.inv-head { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding-block: 10px; }
.inv-main h3 { font-family: var(--font-body); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cond-reparar { color: var(--warn); font-weight: 600; }
.cond-danado { color: var(--bad); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.charge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
.charge svg { width: 18px; height: 18px; }
.charge.on { background: var(--ok-soft); color: var(--ok); }
.charge.off { background: var(--bad-soft); color: var(--bad); }
.na { font-size: 13px; color: var(--muted); }
.inv-resp { display: grid; gap: 4px; min-width: 0; }
.for-ev { font-size: 12.5px; color: var(--brand-ink); font-weight: 600; }
.inv-actions { display: flex; gap: 2px; justify-content: flex-end; }
@media (max-width: 760px) {
  .inv-head { display: none; }
  .inv-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main actions" "charge charge" "resp resp"; gap: 10px; }
  .inv-main { grid-area: main; } .inv-charge { grid-area: charge; } .inv-resp { grid-area: resp; } .inv-actions { grid-area: actions; align-self: start; }
}

/* ---------- Calendario ---------- */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; min-width: 0; }
.cal-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-nav h3 { font-size: 20px; font-weight: 800; margin-right: auto; }
.cal-nav h3::first-letter { text-transform: uppercase; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.sw.jornada { background: var(--brand); }
.sw.charla { background: var(--brand-soft); border: 1.5px solid var(--brand-ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; text-align: center; padding: 4px 0; }
.day { min-height: 92px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.day:hover { border-color: var(--brand); }
.day.out { background: var(--surface-2); color: var(--muted); border-color: transparent; }
.day.today .dn { background: var(--charcoal); color: var(--on-charcoal); }
.day.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.dn { font-size: 13px; font-weight: 700; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chip { display: block; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.jornada { background: var(--brand); color: #0B2A26; }
.chip.charla { background: var(--brand-soft); color: var(--brand-ink); box-shadow: inset 0 0 0 1px var(--brand-ink); }
.more { font-size: 11.5px; color: var(--muted); font-weight: 600; padding-left: 4px; }
.dots { display: none; gap: 3px; justify-content: center; margin-top: auto; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.dots i.jornada { background: var(--brand); } .dots i.charla { background: var(--brand-ink); }
@media (max-width: 600px) {
  .day { min-height: 54px; align-items: center; padding: 4px 2px; }
  .day .chip, .day .more { display: none; }
  .dots { display: flex; }
}
.side { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { font-size: 17px; font-weight: 800; }
.panel h3::first-letter { text-transform: uppercase; }
.ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ev { width: 100%; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 8px; cursor: pointer; }
.ev:hover { border-color: var(--brand); }
.ev-date { border-radius: 8px; text-align: center; padding: 4px 0; font-variant-numeric: tabular-nums; line-height: 1.1; }
.ev-date b { display: block; font-family: var(--font-display); font-size: 18px; }
.ev-date small { font-size: 11px; text-transform: uppercase; font-weight: 700; }
.ev-date.jornada { background: var(--brand); color: #0B2A26; }
.ev-date.charla { background: var(--brand-soft); color: var(--brand-ink); }
.ev strong { display: block; overflow-wrap: anywhere; font-weight: 600; }
.ev span { font-size: 13px; color: var(--muted); }

/* ---------- Charlas: voluntarios, temas y programación ---------- */
.plan-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .plan-layout { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 18px; min-width: 0; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.add-row.one { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 520px) { .add-row { grid-template-columns: minmax(0, 1fr); } }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.roster li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-md); background: var(--surface-2); }
.roster li.topic { grid-template-columns: 30px minmax(0, 1fr) auto; }
.roster .edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; min-width: 0; }
@media (max-width: 520px) { .roster .edit { grid-template-columns: minmax(0, 1fr); } }
.roster input { padding: 6px 9px; background: var(--surface); }
.roster .tnum { font-family: var(--font-display); font-weight: 800; color: var(--brand-ink); text-align: center; font-variant-numeric: tabular-nums; }
.assign { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.assign span { padding: 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.assign b { color: var(--brand-ink); }
.assign .none { border-style: dashed; color: var(--muted); }
.plan-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.plan-head .field { flex: 1 1 220px; }
.shift { display: grid; gap: 8px; }
.shift-title { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.shift-title svg { width: 18px; height: 18px; color: var(--brand-ink); }
.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.slot.locked { border-color: var(--brand); background: var(--brand-soft); }
.slot.dup select.vol { border-color: var(--bad-dot); }
.slot-n { font-family: var(--font-display); font-weight: 800; font-size: 18px; text-align: center; color: var(--brand-ink); font-variant-numeric: tabular-nums; }
.slot select { padding: 7px 9px; }
.lock[aria-pressed="true"] { color: var(--brand-ink); background: var(--surface); }
@media (max-width: 560px) {
  .slot { grid-template-columns: 34px minmax(0, 1fr) 34px; }
  .slot .vol { grid-column: 2 / 3; }
  .slot .lock { grid-row: 1; grid-column: 3; }
}
.plan-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); }
.warn-text { font-size: 13px; color: var(--warn); font-weight: 600; }

/* ---------- Diálogo ---------- */
dialog.sheet { border: 0; padding: 0; border-radius: var(--r-lg); background: var(--surface); color: var(--fg); width: min(600px, calc(100% - 24px)); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
dialog.sheet::backdrop { background: var(--backdrop); }
.dlg-body { padding: 20px; display: grid; gap: 14px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dlg-head h2 { font-size: 22px; font-weight: 800; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dlg-actions .left { margin-right: auto; }
.flag-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.flag-pick label { position: relative; }
.flag-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.flag-pick .pill { cursor: pointer; padding: 7px 12px 7px 10px; font-size: 13.5px; border: 2px solid transparent; }
.flag-pick input:checked + .pill { border-color: currentColor; }
.flag-pick input:focus-visible + .pill { outline: 2px solid var(--brand); outline-offset: 2px; }
.comments { border-top: 1px solid var(--line); padding: 18px 20px 20px; display: grid; gap: 12px; background: var(--surface-2); }
.comments h3 { font-size: 17px; font-weight: 800; }
.c-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.c-item { background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 2px; }
.c-meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.c-meta strong { color: var(--fg); }
.c-meta button { margin-left: auto; }
.c-item p { overflow-wrap: anywhere; white-space: pre-wrap; }
.comment-form { display: grid; gap: 8px; }

/* ---------- Avisos ---------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; width: min(440px, calc(100% - 32px)); }
.toast { background: var(--charcoal); color: var(--on-charcoal); padding: 11px 14px; border-radius: var(--r-md); font-size: 14px; box-shadow: var(--shadow); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.loading { padding: 48px 0; text-align: center; color: var(--muted); }
</style>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const TODAY = iso(new Date());
const fDay = new Intl.DateTimeFormat('es-VE', { day: 'numeric', month: 'short' });
const fLong = new Intl.DateTimeFormat('es-VE', { weekday: 'long', day: 'numeric', month: 'long' });
const fMonth = new Intl.DateTimeFormat('es-VE', { month: 'long', year: 'numeric' });
const fStamp = new Intl.DateTimeFormat('es-VE', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const fWeekShort = new Intl.DateTimeFormat('es-VE', { month: 'short' });
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const byDate = (a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.time || '').localeCompare(String(b.time || ''));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function readJSON(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* almacenamiento bloqueado: se ignora */ } }

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* =====================================================================
   3. ALMACENAMIENTO
   - Modo "compartido": base de datos del artifact (todos los integrantes ven
     los mismos datos en vivo).
   - Modo "local": si se abre el archivo fuera de Claude, guarda en este navegador.
   ===================================================================== */
const S = {}; COLS.forEach(c => { S[c] = []; });

const Store = {
  mode: 'loading', db: null, chains: {},

  async init() {
    // a) Fuera de Claude: Firebase, si está configurado
    if (FIREBASE_CONFIG.projectId) {
      if (window.firebase) return this.startFirebase();
      setSync('err', 'No cargó Firebase');
      toast('No se pudo cargar Firebase. Revisa tu conexión a internet y recarga la página.');
      return this.startLocal();
    }
    // b) Dentro de Claude: almacenamiento compartido del artifact
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { db = await window.claude.use('db'); } catch (e) { db = null; }
    }
    if (!db) return this.startLocal();
    this.db = db; this.mode = 'shared';
    this.subscribe(db, 'Compartido · en vivo');
  },

  // Conexión a Firestore con inicio de sesión anónimo (nadie tiene que crear cuenta)
  async startFirebase() {
    setSync('wait', 'Conectando con la nube…');
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      const fs = firebase.firestore();
      // Copia sin conexión: la app sigue mostrando datos si se cae el internet
      try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* no disponible en este navegador */ }
      this.db = fs; this.mode = 'shared';
      this.subscribe(fs, 'En la nube · en vivo');
    } catch (e) {
      console.error(e);
      const code = String(e && e.code || '');
      setSync('err', 'Sin conexión con la nube');
      toast(code.includes('operation-not-allowed') || code.includes('admin-restricted')
        ? 'Falta activar el inicio de sesión "Anónimo" en Firebase Authentication.'
        : 'No se pudo conectar con Firebase. Revisa la configuración pegada en el código.');
      this.cloudError = true;
      this.startLocal();
    }
  },

  // Escucha en vivo cada colección (igual para Claude y para Firebase)
  subscribe(db, okText) {
    setSync('wait', 'Conectando…');
    const pending = new Set(COLS);
    const timer = setTimeout(() => { if (pending.size) setSync('err', 'Sin conexión: los datos pueden no estar al día'); }, 10000);
    const listen = (col, attempt) => {
      db.collection(col).onSnapshot(snap => {
        S[col] = snap.docs.filter(d => d.exists).map(d => Object.assign({}, d.data(), { id: d.id }));
        if (!snap.metadata.fromCache && pending.delete(col) && !pending.size) {
          clearTimeout(timer); setSync('ok', okText);
        }
        scheduleRender();
      }, err => {
        const code = (err && err.code) || 'desconocido';
        console.error('Error en "' + col + '":', err);
        clearTimeout(timer);
        // Muestra el código exacto para poder diagnosticar
        setSync('err', code === 'revoked' ? 'Acceso retirado' : 'Sin conexión (' + code + ')');
        if (code === 'permission-denied' && attempt === 0) toast('La base de datos no permite leer (permission-denied). Reintentando…');
        // Reintenta solo: útil si las reglas se acaban de publicar o se cayó el internet
        if (code !== 'revoked' && attempt < 20) setTimeout(() => listen(col, attempt + 1), 15000);
        scheduleRender();
      });
    };
    COLS.forEach(col => listen(col, 0));
    scheduleRender();
  },

  startLocal() {
    this.mode = 'local';
    const saved = readJSON(LS_DATA, {});
    COLS.forEach(c => { S[c] = Array.isArray(saved[c]) ? saved[c] : []; });
    setSync('wait', 'Guardado solo en este navegador');
    scheduleRender();
  },
  saveLocal() { const out = {}; COLS.forEach(c => { out[c] = S[c]; }); writeJSON(LS_DATA, out); },

  // Escrituras en cola por documento (una a la vez), con un reintento si falla la red
  queue(key, fn) {
    const run = () => fn().catch(e => (e && e.code === 'unavailable') ? sleep(400 + Math.random() * 600).then(fn) : Promise.reject(e));
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(run);
    this.chains[key] = p;
    return p.catch(handleWriteError);
  },
  ready() {
    if (this.mode === 'loading') { toast('Conectando con los datos del comité, espera un momento.'); return false; }
    return true;
  },
  set(col, id, data) {
    if (!this.ready()) return Promise.resolve();
    const body = Object.assign({}, data); delete body.id;
    if (this.mode === 'shared') return this.queue(col + '/' + id, () => this.db.collection(col).doc(id).set(body));
    const arr = S[col], i = arr.findIndex(x => x.id === id), row = Object.assign({}, body, { id });
    if (i >= 0) arr[i] = row; else arr.push(row);
    this.saveLocal(); scheduleRender(); return Promise.resolve();
  },
  update(col, id, patch) {
    if (!this.ready()) return Promise.resolve();
    if (this.mode === 'shared') return this.queue(col + '/' + id, () => this.db.collection(col).doc(id).update(patch));
    const row = S[col].find(x => x.id === id); if (row) Object.assign(row, patch);
    this.saveLocal(); scheduleRender(); return Promise.resolve();
  },
  remove(col, id) {
    if (!this.ready()) return Promise.resolve();
    if (this.mode === 'shared') return this.queue(col + '/' + id, () => this.db.collection(col).doc(id).delete());
    S[col] = S[col].filter(x => x.id !== id);
    this.saveLocal(); scheduleRender(); return Promise.resolve();
  }
};

function handleWriteError(e) {
  const code = e && e.code;
  if (code === 'permission-denied') { toast('La base de datos rechazó el cambio: revisa las reglas de Firestore.'); }
  else if (code === 'invalid_argument') { ui.readOnly = true; toast('No se pudo guardar: tu acceso a esta página es de solo lectura.'); scheduleRender(); }
  else if (code === 'quota_exceeded') toast('Se llenó el espacio de datos. Elimina elementos que ya no uses e inténtalo otra vez.');
  else if (code === 'revoked') toast('Ya no tienes acceso para editar esta página.');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo otra vez.');
}

function setSync(state, text) {
  const el = $('#sync');
  el.className = 'sync' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  $('#sync-text').textContent = text;
}

/* =====================================================================
   5. RENDER PRINCIPAL
   ===================================================================== */
let rafPending = false;
function scheduleRender() { if (!rafPending) { rafPending = true; requestAnimationFrame(render); } }

function render() {
  rafPending = false;
  // Conservar el foco y el texto si alguien está escribiendo cuando llegan cambios de otro integrante
  const a = document.activeElement;
  const keep = a && a.id && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#main')
    ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;

  renderTabs();
  $('#vol-list').innerHTML = sortedVols().map(v => '<option value="' + esc(v.name) + '">').join('');

  const main = $('#main');
  if (Store.mode === 'loading') { main.innerHTML = '<p class="loading">Cargando el espacio del comité…</p>'; return; }
  const views = { tareas: viewTasks, inventario: viewInventory, calendario: viewCalendar, charlas: viewPlanner };
  main.innerHTML = '<section class="view">' + banner() + views[ui.view]() + '</section>';

  // En el diálogo de tarea, solo se refresca la lista de comentarios (no el formulario)
  if (dlgState && dlgState.kind === 'task' && dlgState.id) {
    const cl = $('#comment-list'); if (cl) cl.innerHTML = commentsHTML(dlgState.id);
  }

  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { if (el.tagName !== 'SELECT') el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}

function renderTabs() {
  const help = S.tasks.filter(t => t.flag === 'rojo' && t.status !== 'lista').length;
  $('#tabs').innerHTML = Object.keys(VIEWS).map(k => {
    const v = VIEWS[k];
    const extra = k === 'tareas' && help ? ' <span class="badge num" title="Tareas que necesitan ayuda">' + help + '</span>' : '';
    return '<a class="tab" href="#' + k + '"' + (ui.view === k ? ' aria-current="page"' : '') + '>' + I[v.icon] + v.label + extra + '</a>';
  }).join('');
}

function banner() {
  if (ui.readOnly) return '<p class="notice">Tienes acceso de solo lectura: puedes ver todo, pero tus cambios no se guardan. Pide a quien administra la página que te dé acceso de colaborador.</p>';
  if (Store.mode === 'local') return Store.cloudError
    ? '<p class="notice">No hay conexión con la nube: por ahora los cambios se guardan solo en este navegador y los demás no los verán.</p>'
    : '<p class="notice info">La app aún no está conectada a la nube: los cambios se guardan solo en este navegador. Pega la configuración de Firebase en el código para compartirla con el comité.</p>';
  return '';
}

function delControl(key, label) {

    return '<span class="confirm">¿Eliminar?<button class="btn danger sm" data-act="do-del" data-key="' + esc(key) + '">Sí</button><button class="btn ghost sm" data-act="cancel-del">No</button></span>';
  }

}

}

   ===================================================================== */
function viewTasks() {
  const all = S.tasks;
  const counts = { pendiente: 0, progreso: 0, lista: 0, verde: 0, amarillo: 0, rojo: 0 };
  all.forEach(t => { counts[t.status || 'pendiente']++; if (t.status !== 'lista') counts[t.flag || 'verde']++; });

  const people = Array.from(new Set(all.map(t => t.assignee).filter(Boolean))).sort();
  const q = norm(ui.taskQ);
  const list = all.filter(t =>
    (!ui.taskStatus || (t.status || 'pendiente') === ui.taskStatus) &&
    (!ui.taskFlag || ((t.flag || 'verde') === ui.taskFlag && t.status !== 'lista')) &&
    (!ui.taskPerson || t.assignee === ui.taskPerson) &&
    (!q || norm(t.title + ' ' + t.desc + ' ' + t.assignee + ' ' + t.email).includes(q))
  ).sort((a, b) =>
    ((a.status === 'lista') - (b.status === 'lista')) ||
    (FLAG_ORDER[a.flag || 'verde'] - FLAG_ORDER[b.flag || 'verde']) ||
    String(a.due || '9999').localeCompare(String(b.due || '9999'))
  );

  const stat = (kind, key, label, dot) =>
    '<button class="stat" data-act="task-stat" data-kind="' + kind + '" data-val="' + key + '" aria-pressed="' + (ui[kind] === key) + '">' +
    '<strong>' + counts[key] + '</strong><span>' + (dot ? '<i style="background:var(--' + dot + ')"></i>' : '') + label + '</span></button>';

  return '' +
    '<div class="view-head"><div><h2>Tareas del comité</h2><p class="lede">Asigna cada tarea a un voluntario, marca su avance y usa el semáforo para pedir apoyo a tiempo.</p></div>' +
    '<button class="btn primary" data-act="task-new">' + I.plus + 'Nueva tarea</button></div>' +
    '<div class="summary">' +
      stat('taskStatus', 'pendiente', 'Sin iniciar') + stat('taskStatus', 'progreso', 'En progreso') + stat('taskStatus', 'lista', 'Listas') +
      stat('taskFlag', 'verde', 'Avanzando', 'ok-dot') + stat('taskFlag', 'amarillo', 'Necesitan apoyo', 'warn-dot') + stat('taskFlag', 'rojo', 'Necesitan ayuda', 'bad-dot') +
    '</div>' +
    '<div class="toolbar">' +
      '<label class="sr-only" for="task-q">Buscar tareas</label><input class="search" id="task-q" type="search" placeholder="Buscar por tarea, voluntario o correo" data-input="taskQ" value="' + esc(ui.taskQ) + '">' +
      selectFilter('task-status', 'taskStatus', 'Todos los estados', STATUS) +
      selectFilter('task-flag', 'taskFlag', 'Todo el semáforo', mapObj(FLAG, f => f.label)) +
      selectFilter('task-person', 'taskPerson', 'Todos los voluntarios', Object.fromEntries(people.map(p => [p, p]))) +
    '</div>' +
    (all.length === 0
      ? emptyState('Aún no hay tareas', 'Crea la primera tarea del comité y asígnala a un voluntario con su nombre y correo.', '<button class="btn primary" data-act="task-new">' + I.plus + 'Crear la primera tarea</button>')
      : list.length === 0
        ? emptyState('Ninguna tarea coincide', 'Prueba con otro filtro o búsqueda.', '<button class="btn" data-act="clear-task-filters">Quitar filtros</button>')
        : '<div class="task-grid">' + list.map(taskCard).join('') + '</div>');
}

function mapObj(o, fn) { const r = {}; Object.keys(o).forEach(k => { r[k] = fn(o[k]); }); return r; }
function selectFilter(id, key, allLabel, options) {
  return '<label class="sr-only" for="' + id + '">' + allLabel + '</label><select id="' + id + '" data-filter="' + key + '"><option value="">' + allLabel + '</option>' +
    Object.keys(options).map(k => '<option value="' + esc(k) + '"' + (ui[key] === k ? ' selected' : '') + '>' + esc(options[k]) + '</option>').join('') + '</select>';

    '<div class="person">' + (t.assignee
        ? '<span class="avatar">' + esc(initials(t.assignee)) + '</span><div><strong>' + esc(t.assignee) + '</strong>' + (t.email ? '<span class="email">' + esc(t.email) + '</span>' : '') + '</div>'

        '<button data-act="task-status" data-id="' + id + '" data-val="' + k + '" aria-pressed="' + (status === k) + '">' + STATUS[k] + '</button>').join('') + '</div>' +

/* =====================================================================
   7. MÓDULO 2 · INVENTARIO (pendones y materiales operativos)
   ===================================================================== */
function viewInventory() {
  const inCat = S.inventory.filter(i => (i.category || 'operativos') === ui.invCat);
  const q = norm(ui.invQ);
  const list = inCat.filter(i =>
    (!q || norm(i.name + ' ' + i.notes + ' ' + i.responsible).includes(q)) &&
    (!ui.invPerson || (ui.invPerson === '__none' ? !i.responsible : i.responsible === ui.invPerson)) &&
    (!ui.invElec || i.electronic) &&
    (!ui.invUncharged || (i.electronic && !i.charged))

function viewCalendar() {
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7; // semana inicia el lunes
  const daysIn = new Date(y, m, 0).getDate();
  const total = Math.ceil((lead + daysIn) / 7) * 7;
  const evByDate = {};
  S.events.slice().sort(byDate).forEach(e => { (evByDate[e.date] = evByDate[e.date] || []).push(e); });

  let cells = '';
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m - 1, 1 - lead + i), key = iso(d), evs = evByDate[key] || [];
    const out = d.getMonth() !== m - 1;
    cells += '<button class="day' + (out ? ' out' : '') + (key === TODAY ? ' today' : '') + (key === ui.calSel ? ' sel' : '') + '" data-act="cal-day" data-date="' + key + '" aria-label="' + esc(fLong.format(d)) + (evs.length ? ', ' + evs.length + ' eventos' : '') + '">' +
      '<span class="dn">' + d.getDate() + '</span>' +
      evs.slice(0, 2).map(e => '<span class="chip ' + e.type + '">' + esc(e.title || EVTYPE[e.type]) + '</span>').join('') +
      (evs.length > 2 ? '<span class="more">+' + (evs.length - 2) + ' más</span>' : '') +
      (evs.length ? '<span class="dots">' + evs.slice(0, 3).map(e => '<i class="' + e.type + '"></i>').join('') + '</span>' : '') +
    '</button>';
  }

  const selEvs = evByDate[ui.calSel] || [];
  const upcoming = S.events.filter(e => e.date >= TODAY).sort(byDate).slice(0, 6);

  return '' +
    '<div class="view-head"><div><h2>Calendario de charlas y jornadas</h2><p class="lede">Toca un día para ver lo programado y agregar una charla o una jornada.</p></div>' +
    '<div class="plan-actions"><button class="btn" data-act="ev-new" data-type="charla" data-date="' + ui.calSel + '">' + I.plus + 'Charla</button><button class="btn primary" data-act="ev-new" data-type="jornada" data-date="' + ui.calSel + '">' + I.plus + 'Jornada</button></div></div>' +
    '<div class="cal-layout">' +
      '<div class="cal"><div class="cal-nav"><h3>' + esc(fMonth.format(first)) + '</h3>' +
        '<button class="icon-btn" data-act="cal-move" data-val="-1" aria-label="Mes anterior">' + I.left + '</button>' +
        '<button class="btn sm" data-act="cal-today">Hoy</button>' +
        '<button class="icon-btn" data-act="cal-move" data-val="1" aria-label="Mes siguiente">' + I.right + '</button></div>' +
        '<div class="cal-grid">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => '<span class="dow">' + d + '</span>').join('') + cells + '</div>' +
        '<div class="legend" style="margin-top:12px"><span><i class="sw jornada"></i>Jornada</span><span><i class="sw charla"></i>Charla</span></div>' +
      '</div>' +
      '<div class="side">' +
        '<div class="panel"><h3>' + esc(fLong.format(parseISO(ui.calSel))) + '</h3>' +
          (selEvs.length ? '<ul class="ev-list">' + selEvs.map(evItem).join('') + '</ul>' : '<p class="hint">Nada programado este día.</p>') +
          '<div class="plan-actions"><button class="btn sm" data-act="ev-new" data-type="charla" data-date="' + ui.calSel + '">' + I.plus + 'Charla</button><button class="btn sm" data-act="ev-new" data-type="jornada" data-date="' + ui.calSel + '">' + I.plus + 'Jornada</button></div></div>' +

/* =====================================================================
   9. MÓDULO 4 · VOLUNTARIOS, TEMAS Y ASIGNACIÓN DE CHARLAS
   Cada jornada tiene 6 charlas: 3 en la mañana y 3 en la noche.
   Un voluntario no se repite dentro del mismo horario.
   ===================================================================== */
function getSlots(evId) {
  const doc = S.schedules.find(s => s.id === evId);
  const slots = (doc && Array.isArray(doc.slots) ? doc.slots : []).slice(0, SLOTS_PER_SHIFT * 2).map(s => Object.assign({ topicId: '', volunteerId: '', locked: false }, s));
  while (slots.length < SLOTS_PER_SHIFT * 2) slots.push({ topicId: '', volunteerId: '', locked: false });
  // Si un voluntario o tema fue eliminado, la casilla queda vacía
  slots.forEach(s => { if (s.topicId && !topicById(s.topicId)) s.topicId = ''; if (s.volunteerId && !volById(s.volunteerId)) s.volunteerId = ''; });
  return slots;
}
function saveSlots(evId, slots) { return Store.set('schedules', evId, { eventId: evId, slots: slots, updatedAt: Date.now() }); }

function currentPlanEvent() {
  const js = jornadas();
  if (!js.length) return null;
  if (ui.planEvent && js.some(j => j.id === ui.planEvent)) return eventById(ui.planEvent);
  return js.find(j => j.date >= TODAY) || js[js.length - 1];
}

// Asignación aleatoria: respeta las casillas fijadas con el candado
function randomize(evId) {
  const vols = S.volunteers.map(v => v.id), tops = S.topics.map(t => t.id);
  if (!vols.length || !tops.length) { toast('Agrega al menos un voluntario y un tema antes de sortear.'); return; }
  const slots = getSlots(evId);

  // Temas: distintos en las 6 charlas mientras alcancen
  const lockedTopics = new Set(slots.filter(s => s.locked && s.topicId).map(s => s.topicId));
  let tPool = shuffle(tops.filter(t => !lockedTopics.has(t))); if (!tPool.length) tPool = shuffle(tops);
  let ti = 0; slots.forEach(s => { if (!s.locked) s.topicId = tPool[ti++ % tPool.length]; });

  // Voluntarios: sin repetir dentro de un horario; en la noche se prioriza a quien no dio charla en la mañana
  const morning = slots.slice(0, SLOTS_PER_SHIFT), night = slots.slice(SLOTS_PER_SHIFT);
  const fill = (shift, preferNot) => {
    const lockedV = new Set(shift.filter(s => s.locked && s.volunteerId).map(s => s.volunteerId));
    const avail = vols.filter(v => !lockedV.has(v));
    let pool = shuffle(avail.filter(v => !preferNot.has(v))).concat(shuffle(avail.filter(v => preferNot.has(v))));
    if (!pool.length) pool = shuffle(vols);
    let vi = 0; shift.forEach(s => { if (!s.locked) s.volunteerId = pool[vi++ % pool.length]; });
  };
  fill(morning, new Set());
  fill(night, new Set(morning.map(s => s.volunteerId)));

  saveSlots(evId, slots);
  toast('Charlas asignadas al azar. Usa el candado para fijar las que quieras conservar.');
}

function viewPlanner() {
  const vols = sortedVols(), tops = sortedTopics();
  const ev = currentPlanEvent();
  const slots = ev ? getSlots(ev.id) : null;

  // Resumen por voluntario para la jornada elegida
  const assignOf = vId => {
    if (!slots) return '';
    const m = slots.slice(0, SLOTS_PER_SHIFT).map((s, i) => s.volunteerId === vId ? (i + 1) : 0).filter(Boolean);
    const n = slots.slice(SLOTS_PER_SHIFT).map((s, i) => s.volunteerId === vId ? (i + 1 + SLOTS_PER_SHIFT) : 0).filter(Boolean);
    const lbl = (arr, name) => arr.length ? arr.map(k => '<span><b>' + name + '</b> · Charla ' + k + ': ' + esc((topicById(slots[k - 1].topicId) || {}).name || 'sin tema') + '</span>').join('') : '<span class="none">' + name + ': sin charla</span>';
    return '<div class="assign">' + lbl(m, 'Mañana') + lbl(n, 'Noche') + '</div>';
  };

  const volPanel = '<div class="panel"><h3>Voluntarios del equipo <span class="hint num">(' + vols.length + ')</span></h3>' +
    '<form id="vol-form" class="add-row"><label class="sr-only" for="v-name">Nombre</label><input id="v-name" name="name" required maxlength="80" placeholder="Nombre y apellido">' +
    '<label class="sr-only" for="v-email">Correo</label><input id="v-email" name="email" type="email" maxlength="120" placeholder="Correo (opcional)"><button class="btn primary" type="submit">' + I.plus + 'Agregar</button></form>' +
    (vols.length ? '<ul class="roster">' + vols.map(v => '<li><span class="avatar">' + esc(initials(v.name)) + '</span>' +
      '<div class="edit"><label class="sr-only" for="vn-' + esc(v.id) + '">Nombre</label><input id="vn-' + esc(v.id) + '" value="' + esc(v.name) + '" data-change="vol-field" data-id="' + esc(v.id) + '" data-field="name" maxlength="80">' +
      '<label class="sr-only" for="ve-' + esc(v.id) + '">Correo</label><input id="ve-' + esc(v.id) + '" type="email" value="' + esc(v.email) + '" placeholder="Correo" data-change="vol-field" data-id="' + esc(v.id) + '" data-field="email" maxlength="120"></div>' +
      delControl('volunteers:' + v.id, v.name) + assignOf(v.id) + '</li>').join('') + '</ul>'
      : '<p class="hint">Agrega a los integrantes del equipo. Podrás editar su nombre y correo directamente en la lista.</p>') +
  '</div>';

  const topPanel = '<div class="panel"><h3>Temas de charla <span class="hint num">(' + tops.length + ')</span></h3>' +
    '<form id="top-form" class="add-row one"><label class="sr-only" for="t-name">Tema</label><input id="t-name" name="name" required maxlength="100" placeholder="Ej. Técnicas de estudio para la universidad"><button class="btn primary" type="submit">' + I.plus + 'Agregar</button></form>' +
    (tops.length ? '<ul class="roster">' + tops.map((t, i) => '<li class="topic"><span class="tnum">' + (i + 1) + '</span>' +
      '<label class="sr-only" for="tn-' + esc(t.id) + '">Tema</label><input id="tn-' + esc(t.id) + '" value="' + esc(t.name) + '" data-change="top-field" data-id="' + esc(t.id) + '" maxlength="100">' +
      delControl('topics:' + t.id, t.name) + '</li>').join('') + '</ul>'
      : '<p class="hint">Agrega los temas que el equipo puede dictar. Se usan para el sorteo de las 6 charlas.</p>') +
  '</div>';

  let planPanel;
  if (!ev) {
    planPanel = '<div class="panel"><h3>Programación de la jornada</h3>' +
      emptyState('No hay jornadas en el calendario', 'Crea una jornada para asignarle sus 6 charlas: 3 en la mañana y 3 en la noche.', '<button class="btn primary" data-act="ev-new" data-type="jornada" data-date="' + TODAY + '">' + I.plus + 'Crear jornada</button>') + '</div>';
  } else {
    const volOpts = sel => '<option value="">Voluntario…</option>' + vols.map(v => '<option value="' + esc(v.id) + '"' + (sel === v.id ? ' selected' : '') + '>' + esc(v.name) + '</option>').join('');
    const topOpts = sel => '<option value="">Tema…</option>' + tops.map(t => '<option value="' + esc(t.id) + '"' + (sel === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('');
    const shiftHTML = (start, label, icon) => {
      const part = slots.slice(start, start + SLOTS_PER_SHIFT);
      const seen = {}; part.forEach(s => { if (s.volunteerId) seen[s.volunteerId] = (seen[s.volunteerId] || 0) + 1; });
      return '<div class="shift"><div class="shift-title">' + icon + label + '</div>' + part.map((s, j) => {
        const idx = start + j, dup = s.volunteerId && seen[s.volunteerId] > 1;
        return '<div class="slot' + (s.locked ? ' locked' : '') + (dup ? ' dup' : '') + '"><span class="slot-n">' + (idx + 1) + '</span>' +
          '<label class="sr-only" for="st-' + idx + '">Tema de la charla ' + (idx + 1) + '</label><select id="st-' + idx + '" class="top" data-change="slot" data-idx="' + idx + '" data-field="topicId">' + topOpts(s.topicId) + '</select>' +
          '<label class="sr-only" for="sv-' + idx + '">Voluntario de la charla ' + (idx + 1) + '</label><select id="sv-' + idx + '" class="vol" data-change="slot" data-idx="' + idx + '" data-field="volunteerId">' + volOpts(s.volunteerId) + '</select>' +
          '<button class="icon-btn lock" data-act="slot-lock" data-idx="' + idx + '" aria-pressed="' + !!s.locked + '" aria-label="' + (s.locked ? 'Liberar' : 'Fijar') + ' charla ' + (idx + 1) + '" title="' + (s.locked ? 'Fijada: el sorteo no la cambia' : 'Fijar para que el sorteo no la cambie') + '">' + (s.locked ? I.lock : I.unlock) + '</button></div>';
      }).join('') + '</div>';
    };
    const dupWarn = [0, SLOTS_PER_SHIFT].some(st => { const ids = slots.slice(st, st + SLOTS_PER_SHIFT).map(s => s.volunteerId).filter(Boolean); return new Set(ids).size !== ids.length; });
    const warns = [];
    if (vols.length && vols.length < SLOTS_PER_SHIFT) warns.push('Con ' + vols.length + ' voluntario(s), alguno dará más de una charla en el mismo horario.');
    if (tops.length && tops.length < SLOTS_PER_SHIFT * 2) warns.push('Hay ' + tops.length + ' tema(s) para 6 charlas: algunos se repetirán.');
    if (dupWarn) warns.push('Hay un voluntario repetido en el mismo horario (marcado en rojo).');
    const done = slots.filter(s => s.topicId && s.volunteerId).length;

    planPanel = '<div class="panel">' +
      '<div class="plan-head"><label class="field"><span>Jornada</span><select id="plan-event" data-change="plan-event">' +
        jornadas().map(j => '<option value="' + esc(j.id) + '"' + (j.id === ev.id ? ' selected' : '') + '>' + fDay.format(parseISO(j.date)) + ' · ' + esc(j.title || 'Jornada') + '</option>').join('') + '</select></label>' +
        '<button class="btn sm" data-act="ev-new" data-type="jornada" data-date="' + TODAY + '">' + I.plus + 'Nueva jornada</button></div>' +
      '<p class="hint">' + esc(fLong.format(parseISO(ev.date))) + (ev.place ? ' · ' + esc(ev.place) : '') + ' · <span class="num">' + done + '/6</span> charlas completas</p>' +
      shiftHTML(0, 'Horario de la mañana', I.sun) + shiftHTML(SLOTS_PER_SHIFT, 'Horario de la noche', I.moon) +
      warns.map(w => '<p class="warn-text">' + esc(w) + '</p>').join('') +
      '<div class="plan-actions"><button class="btn primary" data-act="plan-random">' + I.shuffle + 'Asignar al azar</button><button class="btn" data-act="plan-clear">Vaciar casillas sin candado</button></div>' +
    '</div>';
  }

  return '' +
    '<div class="view-head"><div><h2>Charlas y voluntarios</h2><p class="lede">Arma el equipo y la lista de temas, y reparte las 6 charlas de cada jornada: una por voluntario en la mañana y otra en la noche, a mano o al azar.</p></div></div>' +
    '<div class="plan-layout"><div class="stack">' + volPanel + topPanel + '</div><div class="stack">' + planPanel + '</div></div>';
}

/* =====================================================================
   10. DIÁLOGOS
   ===================================================================== */
const dlg = $('#dlg');
function openDialog(kind, id, preset) {
  dlgState = { kind: kind, id: id || null };
  const html = kind === 'task' ? taskDialogHTML(id ? S.tasks.find(t => t.id === id) : null)
    : kind === 'item' ? itemDialogHTML(id ? S.inventory.find(i => i.id === id) : null)
    : eventDialogHTML(id ? eventById(id) : null, preset || {});
  $('#dlg-content').innerHTML = html;
  ui.confirm = null;
  if (!dlg.open) dlg.showModal();
  const first = dlg.querySelector('input:not([type=hidden]), select, textarea'); if (first && !id) first.focus();
}
function closeDialog() { dlgState = null; ui.confirm = null; if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { dlgState = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); }); // clic fuera del diálogo

/* =====================================================================
   11. EVENTOS (delegados)
   ===================================================================== */
function deleteByKey(key) {
  const i = key.indexOf(':'), col = key.slice(0, i), id = key.slice(i + 1);
  ui.confirm = null;
  if (col === 'tasks') commentsOf(id).forEach(c => Store.remove('comments', c.id));
  if (col === 'events') { if (S.schedules.some(s => s.id === id)) Store.remove('schedules', id); S.inventory.filter(it => it.eventId === id).forEach(it => Store.update('inventory', it.id, { eventId: '' })); }
  Store.remove(col, id);
  if (dlgState && ((col === 'tasks' && dlgState.kind === 'task' && dlgState.id === id) || (col === 'events' && dlgState.kind === 'event' && dlgState.id === id))) closeDialog();
  else if (col === 'events' || col === 'comments') { /* el diálogo se mantiene */ }
  toast('Eliminado.');
  scheduleRender();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'task-new': openDialog('task'); break;
    case 'task-edit': openDialog('task', id); break;
    case 'task-flag': Store.update('tasks', id, { flag: b.dataset.val, updatedAt: Date.now() }); break;
    case 'task-status': Store.update('tasks', id, { status: b.dataset.val, updatedAt: Date.now() }); break;
    case 'task-stat': { const k = b.dataset.kind; ui[k] = ui[k] === b.dataset.val ? '' : b.dataset.val; scheduleRender(); break; }
    case 'clear-task-filters': ui.taskQ = ui.taskStatus = ui.taskFlag = ui.taskPerson = ''; scheduleRender(); break;

    case 'inv-new': openDialog('item'); break;
    case 'inv-edit': openDialog('item', id); break;
    case 'inv-cat': ui.invCat = b.dataset.val; ui.invPerson = ''; scheduleRender(); break;
    case 'inv-charge': { const it = S.inventory.find(x => x.id === id); if (it) Store.update('inventory', id, { charged: !it.charged }); break; }
    case 'clear-inv-filters': ui.invQ = ui.invPerson = ''; ui.invElec = ui.invUncharged = false; scheduleRender(); break;

    case 'cal-move': { const [y, m] = ui.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + Number(b.dataset.val), 1); ui.calMonth = iso(d).slice(0, 7); scheduleRender(); break; }
    case 'cal-today': ui.calMonth = TODAY.slice(0, 7); ui.calSel = TODAY; scheduleRender(); break;
    case 'cal-day': ui.calSel = b.dataset.date; if (b.dataset.date.slice(0, 7) !== ui.calMonth) ui.calMonth = b.dataset.date.slice(0, 7); scheduleRender(); break;
    case 'ev-new': openDialog('event', null, { type: b.dataset.type, date: b.dataset.date }); break;
    case 'ev-edit': openDialog('event', id); break;
    case 'ev-plan': ui.planEvent = id; closeDialog(); location.hash = 'charlas'; break;

    case 'slot-lock': { const ev = currentPlanEvent(); if (!ev) break; const s = getSlots(ev.id); const i = Number(b.dataset.idx); s[i].locked = !s[i].locked; saveSlots(ev.id, s); break; }
    case 'plan-random': { const ev = currentPlanEvent(); if (ev) randomize(ev.id); break; }
    case 'plan-clear': { const ev = currentPlanEvent(); if (!ev) break; const s = getSlots(ev.id).map(x => x.locked ? x : { topicId: '', volunteerId: '', locked: false }); saveSlots(ev.id, s); break; }

    case 'ask-del': ui.confirm = b.dataset.key; refreshAfterConfirm(); break;
    case 'cancel-del': ui.confirm = null; refreshAfterConfirm(); break;
    case 'do-del': deleteByKey(b.dataset.key); refreshAfterConfirm(); break;
    case 'dlg-close': closeDialog(); break;
  }
});

// La confirmación de borrado también puede vivir dentro de un diálogo
function refreshAfterConfirm() {
  scheduleRender();
  if (dlgState && dlgState.kind === 'event' && dlgState.id) {
    const ev = eventById(dlgState.id); const left = dlg.querySelector('.dlg-actions .left');
    if (ev && left) left.innerHTML = delControl('events:' + ev.id, 'fecha');
  }
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input) { ui[t.dataset.input] = t.value; scheduleRender(); }
  // Al escribir el nombre de un voluntario conocido, se completa su correo
  if (t.id === 'f-assignee') {
    const v = S.volunteers.find(x => norm(x.name) === norm(t.value)); const em = $('#f-email');
    if (v && v.email && em && !em.value) em.value = v.email;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { ui[t.dataset.filter] = t.value; scheduleRender(); return; }
  if (t.dataset.check) { ui[t.dataset.check] = t.checked; scheduleRender(); return; }
  if (t.id === 'i-elec') { $('#i-charged-wrap').hidden = !t.checked; return; }
  switch (t.dataset.change) {
    case 'inv-resp': Store.update('inventory', t.dataset.id, { responsible: t.value }); break;
    case 'vol-field': {
      const v = volById(t.dataset.id); const val = t.value.trim();
      if (!v || v[t.dataset.field] === val) break;
      if (t.dataset.field === 'name' && !val) { t.value = v.name; toast('El nombre no puede quedar vacío.'); break; }
      Store.update('volunteers', v.id, { [t.dataset.field]: val }); break;
    }
    case 'top-field': {
      const tp = topicById(t.dataset.id); const val = t.value.trim();
      if (!tp || tp.name === val) break;
      if (!val) { t.value = tp.name; toast('El tema no puede quedar vacío.'); break; }
      Store.update('topics', tp.id, { name: val }); break;
    }
    case 'plan-event': ui.planEvent = t.value; scheduleRender(); break;
    case 'slot': {
      const ev = currentPlanEvent(); if (!ev) break;
      const s = getSlots(ev.id); s[Number(t.dataset.idx)][t.dataset.field] = t.value; saveSlots(ev.id, s); break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f), val = k => String(fd.get(k) || '').trim();

  if (f.id === 'task-form') {
    const id = f.dataset.id || uid(), old = S.tasks.find(t => t.id === id) || {};
    Store.set('tasks', id, {
      title: val('title'), desc: val('desc'), assignee: val('assignee'), email: val('email'),
      due: val('due'), status: val('status') || 'pendiente', flag: val('flag') || 'verde',
      createdAt: old.createdAt || Date.now(), updatedAt: Date.now()
    });
    toast(f.dataset.id ? 'Tarea actualizada.' : 'Tarea creada.');
    if (f.dataset.id) closeDialog(); else openDialog('task', id); // al crear, se abre para poder comentar
  }
  else if (f.id === 'comment-form') {
    const author = val('author'), text = val('text'); if (!author || !text) return;
    prefs.author = author; writeJSON(LS_PREFS, prefs);
    Store.set('comments', uid(), { taskId: f.dataset.task, author: author, text: text, at: Date.now() });
    $('#c-text').value = '';
  }
  else if (f.id === 'item-form') {
    const id = f.dataset.id || uid(), electronic = fd.get('electronic') === 'on';
    Store.set('inventory', id, {
      name: val('name'), category: val('category') || 'operativos', qty: Math.max(1, parseInt(val('qty'), 10) || 1),
      condition: val('condition') || 'bueno', responsible: val('responsible'), eventId: val('eventId'),
      electronic: electronic, charged: electronic && fd.get('charged') === 'on', notes: val('notes'), updatedAt: Date.now()
    });
    ui.invCat = val('category') || ui.invCat;
    toast(f.dataset.id ? 'Objeto actualizado.' : 'Objeto agregado al inventario.');
    closeDialog();
  }
  else if (f.id === 'event-form') {
    const id = f.dataset.id || uid();
    const data = { type: val('type'), date: val('date'), title: val('title'), time: val('time'), place: val('place'), notes: val('notes') };
    Store.set('events', id, data);
    ui.calSel = data.date; ui.calMonth = data.date.slice(0, 7);
    if (data.type === 'jornada' && !f.dataset.id) ui.planEvent = id;
    toast(f.dataset.id ? 'Fecha actualizada.' : (EVTYPE[data.type] + ' agregada al calendario.'));
    closeDialog();
  }
  else if (f.id === 'vol-form') {
    const name = val('name'); if (!name) return;
    if (S.volunteers.some(v => norm(v.name) === norm(name))) { toast('Ese voluntario ya está en la lista.'); return; }
    Store.set('volunteers', uid(), { name: name, email: val('email'), order: Date.now() });
    f.reset(); $('#v-name').focus();
  }
  else if (f.id === 'top-form') {
    const name = val('name'); if (!name) return;
    Store.set('topics', uid(), { name: name, order: Date.now() });
    f.reset(); $('#t-name').focus();
  }
});

/* =====================================================================
   12. NAVEGACIÓN POR PESTAÑAS (#tareas, #inventario, #calendario, #charlas)
   ===================================================================== */
function route() {
  const h = location.hash.replace('#', '');
  ui.view = VIEWS[h] ? h : 'tareas';
  ui.confirm = null;
  scheduleRender();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

route();
Store.init();
})();
</script>
